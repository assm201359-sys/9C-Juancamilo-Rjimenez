<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog del Guerrero</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:
linear-gradient(rgba(0,0,0,.85),rgba(0,0,0,.85)),
url("https://images.unsplash.com/photo-1528459801416-a9e53bbf4e17?auto=format&fit=crop&w=1500&q=80");

background-size:cover;
background-position:center;
background-attachment:fixed;
color:white;
overflow-x:hidden;

}

header{

background:#8B0000;
padding:20px;
text-align:center;
font-size:35px;
font-weight:bold;
letter-spacing:3px;
border-bottom:4px solid gold;
box-shadow:0 0 20px red;

}

.caja{

width:92%;
max-width:700px;
margin:35px auto;
background:rgba(0,0,0,.75);
padding:30px;
border-radius:20px;
border:2px solid red;
box-shadow:0 0 20px red;

}

h2{

color:gold;
text-align:center;
margin-bottom:20px;
font-size:30px;

}

label{

display:block;
margin-top:15px;
margin-bottom:7px;
font-weight:bold;

}

input,textarea{

width:100%;
padding:13px;
border:none;
outline:none;
border-radius:10px;
font-size:16px;
font-family:Arial,Helvetica,sans-serif;
transition:.4s;

}

textarea{

resize:vertical;
min-height:130px;

}

input:focus,
textarea:focus{

box-shadow:0 0 20px gold;
transform:scale(1.02);

}

button{

margin-top:20px;
padding:13px 30px;
font-size:17px;
font-weight:bold;
background:red;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
transition:.4s;

}

button:hover{

background:gold;
color:black;
transform:scale(1.06);
box-shadow:0 0 20px gold;

}

.volver{

background:#333;

}

.volver:hover{

background:#2196f3;
color:white;

}

.entrada{

margin-top:25px;
background:#141414;
border:2px solid red;
border-radius:15px;
padding:20px;
text-align:left;
animation:aparece .6s;

}

@keyframes aparece{

from{

opacity:0;
transform:translateY(20px);

}

to{

opacity:1;
transform:translateY(0);

}

}

.entrada h3{

color:gold;
font-size:22px;
margin-bottom:8px;

}

.entrada .fecha{

color:#ff6b6b;
font-size:14px;
margin-bottom:12px;

}

.entrada p{

font-size:17px;
line-height:28px;
color:#ddd;

}

.entrada .eliminar{

margin-top:15px;
background:#c0392b;
padding:8px 18px;
font-size:14px;

}

.entrada .eliminar:hover{

background:#e74c3c;
color:white;

}

.mensaje{

text-align:center;
color:lime;
margin-top:15px;
font-size:18px;
min-height:25px;

}

.vacio{

text-align:center;
color:#bbb;
font-size:18px;
margin-top:25px;
font-style:italic;

}

footer{

margin-top:40px;
padding:20px;
text-align:center;
background:black;
border-top:3px solid gold;

}

</style>

</head>

<body>

<header>

📖 BLOG DEL GUERRERO 📖

</header>

<div class="caja">

<h2>Escribe tu Entrada</h2>

<label>Título</label>

<input type="text" id="titulo" placeholder="Título de tu entrada">

<label>Mensaje</label>

<textarea id="mensaje" placeholder="Cuéntanos tus experiencias..."></textarea>

<button onclick="publicar()">✍ Publicar</button>

<a href="index.html">

<button class="volver">🏠 Volver al Menú</button>

</a>

<h2 class="mensaje" id="aviso"></h2>

<h2>Últimas Entradas</h2>

<div id="lista"></div>

</div>

<footer>

⚔ "Un blog es el diario de batalla de un guerrero." ⚔

</footer>

<script>

const lista=document.getElementById("lista");
const aviso=document.getElementById("aviso");

function publicar(){

let titulo=document.getElementById("titulo").value;
let texto=document.getElementById("mensaje").value;

if(titulo==""||texto==""){

aviso.style.color="red";
aviso.innerHTML="⚠ Completa el título y el mensaje.";

return;

}

let entradas=JSON.parse(localStorage.getItem("blog")||"[]");

let fecha=new Date();

entradas.unshift({

titulo:titulo,
texto:texto,
fecha:fecha.getDate()+"/"+(fecha.getMonth()+1)+"/"+fecha.getFullYear()+" - "+fecha.getHours()+":"+(fecha.getMinutes()<10?"0":"")+fecha.getMinutes()

});

localStorage.setItem("blog",JSON.stringify(entradas));

document.getElementById("titulo").value="";
document.getElementById("mensaje").value="";

aviso.style.color="lime";
aviso.innerHTML="✅ Entrada publicada con éxito.";

mostrar();

}

function eliminar(indice){

let entradas=JSON.parse(localStorage.getItem("blog")||"[]");

entradas.splice(indice,1);

localStorage.setItem("blog",JSON.stringify(entradas));

mostrar();

}

function mostrar(){

let entradas=JSON.parse(localStorage.getItem("blog")||"[]");

if(entradas.length==0){

lista.innerHTML='<p class="vacio">Aún no hay entradas. ¡Publica la primera!</p>';

return;

}

let html="";

for(let i=0;i<entradas.length;i++){

html+='<div class="entrada">'+
'<h3>⚔ '+entradas[i].titulo+'</h3>'+
'<p class="fecha">🗓 '+entradas[i].fecha+'</p>'+
'<p>'+entradas[i].texto+'</p>'+
'<button class="eliminar" onclick="eliminar('+i+')">🗑 Eliminar</button>'+
'</div>';

}

lista.innerHTML=html;

}

mostrar();

</script>

</body>
</html>
