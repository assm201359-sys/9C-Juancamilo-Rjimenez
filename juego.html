<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Battle Arena</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050509;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

#game{
    width:100vw;
    height:100vh;
    display:block;
    image-rendering:pixelated;
}

#menu{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle,#29205c,#080814 65%,#020204);
}

.menu-box{
    width:min(800px,90%);
    padding:45px;
    text-align:center;
    background:rgba(8,8,25,.94);
    border:4px solid #ff3bd4;
    box-shadow:
        0 0 20px #ff3bd4,
        0 0 70px #5b3cff;
}

h1{
    color:#fff;
    font-size:clamp(45px,7vw,85px);
    letter-spacing:6px;
    text-shadow:
        5px 5px #ff2bb5,
        10px 10px #3824ff;
    margin-bottom:10px;
}

.subtitle{
    color:#aaa;
    font-size:18px;
    margin-bottom:35px;
}

button{
    padding:18px 50px;
    background:#ff2dbd;
    border:3px solid white;
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:7px 7px #050509;
    transition:.15s;
}

button:hover{
    transform:translate(-3px,-3px);
    background:#4d6cff;
    box-shadow:10px 10px #050509;
}

.controls{
    margin-top:30px;
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

.key{
    padding:9px 13px;
    border:2px solid #555;
    background:#151525;
    color:#ddd;
    font-size:13px;
}

#hud{
    position:fixed;
    top:18px;
    left:2%;
    right:2%;
    z-index:5;
    display:flex;
    justify-content:space-between;
    pointer-events:none;
}

.playerHUD{
    width:42%;
}

.hud-name{
    color:white;
    font-weight:bold;
    font-size:18px;
    margin-bottom:5px;
    text-shadow:2px 2px #000;
}

.bar{
    height:27px;
    background:#111;
    border:3px solid white;
    box-shadow:0 0 12px #000;
}

.hp{
    height:100%;
    width:100%;
    background:linear-gradient(90deg,#25ff73,#b5ff38);
    transition:.15s;
}

.enemyHP{
    background:linear-gradient(90deg,#ff2525,#ffb02e);
}

.energy{
    height:10px;
    margin-top:6px;
    background:#111;
    border:2px solid white;
}

.energy div{
    width:0%;
    height:100%;
    background:#24caff;
    box-shadow:0 0 10px #24caff;
}

#centerText{
    position:fixed;
    z-index:6;
    top:28%;
    left:50%;
    transform:translateX(-50%);
    color:#fff;
    font-size:70px;
    font-weight:900;
    text-shadow:
        5px 5px #ff249d,
        10px 10px #1e2cff;
    opacity:0;
    pointer-events:none;
}

#centerText.show{
    animation:centerAnim .8s;
}

@keyframes centerAnim{
    0%{
        opacity:0;
        transform:translateX(-50%) scale(.2);
    }
    40%{
        opacity:1;
        transform:translateX(-50%) scale(1.3);
    }
    100%{
        opacity:0;
        transform:translateX(-50%) scale(1);
    }
}

#combo{
    position:fixed;
    right:7%;
    top:35%;
    color:#ffe84a;
    font-size:42px;
    font-weight:bold;
    text-shadow:4px 4px #ff176e;
    opacity:0;
    z-index:10;
}

#combo.show{
    animation:comboAnim .7s;
}

@keyframes comboAnim{
    0%{
        opacity:0;
        transform:scale(.3) rotate(-10deg);
    }
    30%{
        opacity:1;
        transform:scale(1.4) rotate(5deg);
    }
    100%{
        opacity:0;
        transform:scale(1);
    }
}

#gameOver{
    position:fixed;
    inset:0;
    z-index:30;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.75);
}

.result{
    text-align:center;
    padding:50px;
    border:4px solid white;
    background:#101020;
    box-shadow:0 0 50px #ff2dbd;
}

.result h2{
    font-size:70px;
    color:#ffe329;
    text-shadow:5px 5px #ff286d;
    margin-bottom:20px;
}

.result p{
    color:white;
    font-size:20px;
    margin-bottom:30px;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- MENU -->

<div id="menu">

<div class="menu-box">

<h1>NEON BATTLE</h1>

<div class="subtitle">
⚡ PIXEL ARCADE FIGHT ⚡
</div>

<button onclick="startGame()">
⚔ INICIAR COMBATE
</button>

<div class="controls">
<div class="key">A / D MOVER</div>
<div class="key">W SALTAR</div>
<div class="key">J GOLPE</div>
<div class="key">K PATADA</div>
<div class="key">L ESPECIAL</div>
</div>

</div>

</div>


<!-- HUD -->

<div id="hud">

<div class="playerHUD">

<div class="hud-name">
NOVA
</div>

<div class="bar">
<div id="playerHP" class="hp"></div>
</div>

<div class="energy">
<div id="playerEnergy"></div>
</div>

</div>


<div class="playerHUD">

<div class="hud-name" style="text-align:right">
VORTEX
</div>

<div class="bar">
<div id="enemyHP" class="hp enemyHP"></div>
</div>

<div class="energy">
<div id="enemyEnergy"></div>
</div>

</div>

</div>


<div id="centerText"></div>

<div id="combo"></div>


<!-- RESULTADO -->

<div id="gameOver">

<div class="result">

<h2 id="resultTitle">
K.O.
</h2>

<p id="resultText">
</p>

<button onclick="location.reload()">
REVANCHA
</button>

</div>

</div>


<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W,H;

function resize(){

    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;

}

window.addEventListener("resize",resize);
resize();


/* ==============================
   VARIABLES
============================== */

let running=false;

let player={
    x:180,
    y:0,
    vx:0,
    vy:0,
    hp:100,
    energy:0,
    facing:1,
    attacking:false,
    attackTimer:0,
    hitCooldown:0,
    jumping:false
};

let enemy={
    x:0,
    y:0,
    vx:0,
    vy:0,
    hp:100,
    energy:0,
    facing:-1,
    attacking:false,
    attackTimer:0,
    hitCooldown:0,
    jumping:false
};

let particles=[];
let projectiles=[];
let screenShake=0;
let combo=0;
let comboTimer=0;

let keys={};


/* ==============================
   TECLADO
============================== */

document.addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()]=true;

    if(!running)return;

    if(e.key.toLowerCase()==="j"){
        playerAttack(10);
    }

    if(e.key.toLowerCase()==="k"){
        playerAttack(16);
    }

    if(e.key.toLowerCase()==="l"){
        specialAttack();
    }

    if(e.key.toLowerCase()==="w"){
        jump();
    }

});

document.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});


/* ==============================
   INICIAR
============================== */

function startGame(){

    document.getElementById("menu").style.display="none";

    running=true;

    player.x=W*.22;
    enemy.x=W*.78;

    player.y=ground();
    enemy.y=ground();

    showCenter("FIGHT!");

}


/* ==============================
   SUELO
============================== */

function ground(){

    return H*.73;

}


/* ==============================
   ATAQUES
============================== */

function playerAttack(damage){

    if(!running || player.attacking)return;

    player.attacking=true;
    player.attackTimer=18;

    let distance=Math.abs(player.x-enemy.x);

    if(distance<170){

        enemy.hp-=damage;

        enemy.hitCooldown=15;

        hitEffect(
            enemy.x,
            enemy.y-90,
            "#ffdf32"
        );

        screenShake=12;

        combo++;

        comboTimer=100;

        showCombo();

        player.energy=Math.min(
            100,
            player.energy+12
        );

        if(enemy.hp<=0){

            enemy.hp=0;
            finish(true);

        }

    }

}


function specialAttack(){

    if(player.energy<50)return;

    player.energy-=50;

    projectiles.push({

        x:player.x,
        y:player.y-95,
        vx:player.facing*14,
        life:80,
        size:35

    });

}


/* ==============================
   SALTO
============================== */

function jump(){

    if(!player.jumping){

        player.vy=-18;
        player.jumping=true;

    }

}


/* ==============================
   ENEMIGO IA
============================== */

function enemyAI(){

    if(!running)return;

    let distance=player.x-enemy.x;

    enemy.facing=distance>0?1:-1;

    if(Math.abs(distance)>150){

        enemy.vx=distance>0?2:-2;

    }else{

        enemy.vx=0;

        if(Math.random()<.025){

            enemyAttack();

        }

    }

}


function enemyAttack(){

    if(enemy.attacking)return;

    enemy.attacking=true;
    enemy.attackTimer=20;

    if(Math.abs(player.x-enemy.x)<160){

        player.hp-=9;

        player.hitCooldown=15;

        hitEffect(
            player.x,
            player.y-90,
            "#ff3b3b"
        );

        screenShake=9;

        enemy.energy=Math.min(
            100,
            enemy.energy+10
        );

        if(player.hp<=0){

            player.hp=0;

            finish(false);

        }

    }

}


/* ==============================
   ACTUALIZACIÓN
============================== */

function update(){

    if(!running)return;

    /* MOVIMIENTO */

    player.vx=0;

    if(keys["a"]){
        player.vx=-5;
        player.facing=-1;
    }

    if(keys["d"]){
        player.vx=5;
        player.facing=1;
    }

    player.x+=player.vx;

    /* FÍSICA */

    player.vy+=.8;
    player.y+=player.vy;

    if(player.y>=ground()){

        player.y=ground();
        player.vy=0;
        player.jumping=false;

    }

    /* LIMITES */

    player.x=Math.max(80,Math.min(W-80,player.x));

    /* ENEMIGO */

    enemyAI();

    enemy.x+=enemy.vx;

    enemy.x=Math.max(80,Math.min(W-80,enemy.x));

    /* ATAQUES */

    if(player.attackTimer>0){

        player.attackTimer--;

    }else{

        player.attacking=false;

    }

    if(enemy.attackTimer>0){

        enemy.attackTimer--;

    }else{

        enemy.attacking=false;

    }

    /* COOLDOWNS */

    if(player.hitCooldown>0)
        player.hitCooldown--;

    if(enemy.hitCooldown>0)
        enemy.hitCooldown--;

    /* COMBO */

    if(comboTimer>0){

        comboTimer--;

    }else{

        combo=0;

    }

    /* PROJECTILES */

    projectiles.forEach(p=>{

        p.x+=p.vx;
        p.life--;

        if(
            Math.abs(p.x-enemy.x)<70 &&
            Math.abs(p.y-(enemy.y-90))<100
        ){

            enemy.hp-=25;

            p.life=0;

            hitEffect(
                enemy.x,
                enemy.y-90,
                "#28dfff"
            );

            screenShake=15;

            if(enemy.hp<=0){

                enemy.hp=0;
                finish(true);

            }

        }

    });

    projectiles=
        projectiles.filter(p=>p.life>0);

    /* PARTICULAS */

    particles.forEach(p=>{

        p.x+=p.vx;
        p.y+=p.vy;

        p.vy+=.15;

        p.life--;

    });

    particles=
        particles.filter(p=>p.life>0);

    if(screenShake>0)
        screenShake--;

    updateHUD();

}


/* ==============================
   DIBUJO PRINCIPAL
============================== */

function draw(){

    ctx.save();

    if(screenShake){

        ctx.translate(
            Math.random()*screenShake-screenShake/2,
            Math.random()*screenShake-screenShake/2
        );

    }

    drawSky();

    drawCity();

    drawGround();

    drawLights();

    drawProjectiles();

    drawCharacter(
        player,
        "#25a8ff",
        "#65e7ff",
        "NOVA"
    );

    drawCharacter(
        enemy,
        "#ff315f",
        "#ff9c38",
        "VORTEX"
    );

    drawParticles();

    ctx.restore();

}


/* ==============================
   CIELO
============================== */

function drawSky(){

    let gradient=ctx.createLinearGradient(
        0,0,0,H
    );

    gradient.addColorStop(0,"#08051d");
    gradient.addColorStop(.45,"#201052");
    gradient.addColorStop(1,"#35143d");

    ctx.fillStyle=gradient;

    ctx.fillRect(0,0,W,H);


    /* LUNA */

    ctx.beginPath();

    ctx.arc(
        W*.75,
        H*.18,
        80,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#fff0a6";
    ctx.shadowBlur=40;
    ctx.shadowColor="#ffe96b";
    ctx.fill();

    ctx.shadowBlur=0;


    /* ESTRELLAS */

    for(let i=0;i<100;i++){

        let x=(i*97)%W;
        let y=(i*43)%(H*.5);

        ctx.fillStyle="#fff";

        ctx.fillRect(
            x,
            y,
            2,
            2
        );

    }

}


/* ==============================
   CIUDAD
============================== */

function drawCity(){

    let buildings=12;

    for(let i=0;i<buildings;i++){

        let width=80+(i%4)*25;
        let height=130+(i%5)*45;

        let x=i*(W/buildings);

        ctx.fillStyle=
            i%2===0
            ? "#0b0b22"
            : "#11112d";

        ctx.fillRect(
            x,
            ground()-height,
            width,
            height
        );

        /* VENTANAS */

        for(
            let yy=ground()-height+20;
            yy<ground()-20;
            yy+=30
        ){

            for(
                let xx=x+12;
                xx<x+width-10;
                xx+=24
            ){

                if((i+Math.floor(yy))%3!==0){

                    ctx.fillStyle=
                        (i+Math.floor(yy))%2===0
                        ? "#ffe64a"
                        : "#55dfff";

                    ctx.fillRect(
                        xx,
                        yy,
                        8,
                        12
                    );

                }

            }

        }

    }

}


/* ==============================
   SUELO
============================== */

function drawGround(){

    ctx.fillStyle="#080808";

    ctx.fillRect(
        0,
        ground(),
        W,
        H-ground()
    );

    /* LÍNEAS */

    ctx.strokeStyle="#292929";
    ctx.lineWidth=2;

    for(let x=-W;x<W*2;x+=80){

        ctx.beginPath();

        ctx.moveTo(
            W/2,
            ground()
        );

        ctx.lineTo(
            x,
            H
        );

        ctx.stroke();

    }

    for(let y=ground();y<H;y+=40){

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(W,y);

        ctx.stroke();

    }

    /* BORDE NEÓN */

    ctx.fillStyle="#ff24c8";

    ctx.fillRect(
        0,
        ground(),
        W,
        5
    );

}


/* ==============================
   LUCES
============================== */

function drawLights(){

    for(let i=0;i<7;i++){

        let x=(i+1)*W/8;

        ctx.fillStyle=
            i%2===0
            ? "#ff1ca8"
            : "#20d9ff";

        ctx.fillRect(
            x,
            ground()-10,
            25,
            10
        );

    }

}


/* ==============================
   PERSONAJE
============================== */

function drawCharacter(p,color1,color2,name){

    ctx.save();

    ctx.translate(p.x,p.y);

    /* SOMBRA */

    ctx.fillStyle="rgba(0,0,0,.5)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        8,
        55,
        15,
        0,0,Math.PI*2
    );

    ctx.fill();


    /* CUERPO */

    ctx.scale(p.facing,1);

    let flash=p.hitCooldown>0;

    if(flash){

        ctx.shadowBlur=25;
        ctx.shadowColor="#fff";

    }


    /* PIERNAS */

    ctx.fillStyle="#161625";

    ctx.fillRect(
        -32,
        -55,
        24,
        60
    );

    ctx.fillRect(
        8,
        -55,
        24,
        60
    );


    /* BOTAS */

    ctx.fillStyle="#08080f";

    ctx.fillRect(
        -40,
        0,
        34,
        13
    );

    ctx.fillRect(
        5,
        0,
        34,
        13
    );


    /* CUERPO */

    ctx.fillStyle=flash?"white":color1;

    ctx.fillRect(
        -38,
        -125,
        76,
        70
    );


    /* ARMADURA */

    ctx.fillStyle=color2;

    ctx.fillRect(
        -30,
        -115,
        60,
        16
    );


    /* BRAZOS */

    ctx.fillStyle=flash?"white":"#e89c75";

    ctx.fillRect(
        -58,
        -120,
        20,
        62
    );

    ctx.fillRect(
        38,
        -120,
        20,
        62
    );


    /* GUANTES */

    ctx.fillStyle=color2;

    ctx.fillRect(
        -62,
        -62,
        27,
        18
    );

    ctx.fillRect(
        35,
        -62,
        27,
        18
    );


    /* CUELLO */

    ctx.fillStyle="#d98968";

    ctx.fillRect(
        -15,
        -140,
        30,
        20
    );


    /* CABEZA */

    ctx.fillStyle=flash?"white":"#eaa27d";

    ctx.fillRect(
        -35,
        -185,
        70,
        48
    );


    /* PELO / CASCO */

    ctx.fillStyle=color2;

    ctx.fillRect(
        -39,
        -195,
        78,
        22
    );

    ctx.fillRect(
        -32,
        -205,
        64,
        12
    );


    /* OJOS */

    ctx.fillStyle="#fff";

    ctx.fillRect(
        -22,
        -165,
        12,
        7
    );

    ctx.fillRect(
        10,
        -165,
        12,
        7
    );


    /* EFECTO DE ATAQUE */

    if(p.attacking){

        ctx.fillStyle="#fff";

        ctx.shadowBlur=25;
        ctx.shadowColor=color2;

        ctx.beginPath();

        ctx.arc(
            65,
            -100,
            35,
            -1,
            1
        );

        ctx.lineWidth=8;
        ctx.strokeStyle=color2;
        ctx.stroke();

        ctx.shadowBlur=0;

    }


    /* NOMBRE */

    ctx.scale(p.facing,1);

    ctx.font="bold 15px Arial";
    ctx.textAlign="center";

    ctx.fillStyle="#fff";

    ctx.fillText(
        name,
        0,
        -220
    );

    ctx.restore();

}


/* ==============================
   PROYECTILES
============================== */

function drawProjectiles(){

    projectiles.forEach(p=>{

        ctx.save();

        ctx.translate(p.x,p.y);

        ctx.shadowBlur=30;
        ctx.shadowColor="#2de5ff";

        let gradient=ctx.createRadialGradient(
            0,0,5,
            0,0,p.size
        );

        gradient.addColorStop(0,"white");
        gradient.addColorStop(.3,"#2de5ff");
        gradient.addColorStop(1,"#313fff");

        ctx.fillStyle=gradient;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();

    });

}


/* ==============================
   PARTÍCULAS
============================== */

function hitEffect(x,y,color){

    for(let i=0;i<30;i++){

        particles.push({

            x:x,
            y:y,

            vx:
                (Math.random()-.5)*15,

            vy:
                (Math.random()-.5)*15,

            life:
                20+Math.random()*20,

            color:color,

            size:
                3+Math.random()*7

        });

    }

}


function drawParticles(){

    particles.forEach(p=>{

        ctx.globalAlpha=p.life/40;

        ctx.fillStyle=p.color;

        ctx.fillRect(
            p.x,
            p.y,
            p.size,
            p.size
        );

    });

    ctx.globalAlpha=1;

}


/* ==============================
   HUD
============================== */

function updateHUD(){

    document.getElementById("playerHP")
    .style.width=player.hp+"%";

    document.getElementById("enemyHP")
    .style.width=enemy.hp+"%";

    document.getElementById("playerEnergy")
    .style.width=player.energy+"%";

    document.getElementById("enemyEnergy")
    .style.width=enemy.energy+"%";

}


/* ==============================
   COMBO
============================== */

function showCombo(){

    let element=
        document.getElementById("combo");

    element.innerText=
        "COMBO x"+combo+"!";

    element.classList.remove("show");

    void element.offsetWidth;

    element.classList.add("show");

}


/* ==============================
   TEXTO CENTRAL
============================== */

function showCenter(text){

    let element=
        document.getElementById("centerText");

    element.innerText=text;

    element.classList.remove("show");

    void element.offsetWidth;

    element.classList.add("show");

}


/* ==============================
   FINAL
============================== */

function finish(won){

    running=false;

    setTimeout(()=>{

        document.getElementById("gameOver")
        .style.display="flex";

        if(won){

            document.getElementById("resultTitle")
            .innerText="¡VICTORIA!";

            document.getElementById("resultText")
            .innerText=
                "🔥 NOVA ha ganado el combate.";

        }else{

            document.getElementById("resultTitle")
            .innerText="DERROTA";

            document.getElementById("resultText")
            .innerText=
                "💥 VORTEX ha ganado el combate.";

        }

    },500);

}


/* ==============================
   GAME LOOP
============================== */

function loop(){

    update();

    draw();

    requestAnimationFrame(loop);

}

loop();

</script>

</body>
</html>
