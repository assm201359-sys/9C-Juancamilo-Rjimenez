<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de Tareas</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:
linear-gradient(rgba(0,0,0,.85),rgba(0,0,0,.85)),
url("https://images.unsplash.com/photo-1484480974693-6ca0a78fb36b?auto=format&fit=crop&w=1500&q=80");

background-size:cover;
background-position:center;
background-attachment:fixed;
color:white;
overflow-x:hidden;

}

header{

background:#8B0000;
padding:20px;
text-align:center;
font-size:32px;
font-weight:bold;
letter-spacing:3px;
border-bottom:4px solid gold;
box-shadow:0 0 20px red;

}

.caja{

width:92%;
max-width:620px;
margin:35px auto;
background:rgba(0,0,0,.78);
padding:30px;
border-radius:20px;
border:2px solid red;
box-shadow:0 0 20px red;

}

h2{

color:gold;
text-align:center;
margin-bottom:20px;
font-size:28px;

}

.agregar{

display:flex;
gap:10px;

}

.agregar input{

flex:1;
padding:14px;
border:none;
outline:none;
border-radius:10px;
font-size:16px;
transition:.4s;

}

.agregar input:focus{

box-shadow:0 0 20px gold;

}

.agregar button{

padding:14px 25px;
font-size:16px;
font-weight:bold;
background:red;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
transition:.4s;

}

.agregar button:hover{

background:gold;
color:black;
transform:scale(1.06);

}

#lista{

margin-top:25px;

}

.tarea{

display:flex;
align-items:center;
gap:12px;
background:#141414;
border:2px solid red;
border-radius:12px;
padding:15px;
margin-bottom:12px;
transition:.4s;

}

.tarea:hover{

transform:scale(1.02);

}

.tarea input[type="checkbox"]{

width:22px;
height:22px;
cursor:pointer;

}

.tarea p{

flex:1;
font-size:18px;
transition:.4s;

}

.tarea.hecha{

border-color:lime;
opacity:.75;

}

.tarea.hecha p{

text-decoration:line-through;
color:lime;

}

.tarea button{

padding:8px 16px;
font-size:14px;
background:#c0392b;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
transition:.4s;

}

.tarea button:hover{

background:#e74c3c;

}

.acciones{

margin-top:20px;
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;

}

.acciones button{

padding:12px 22px;
font-size:15px;
font-weight:bold;
background:red;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
transition:.4s;

}

.acciones button:hover{

background:gold;
color:black;

}

.volver{

background:#333;

}

.volver:hover{

background:#2196f3;
color:white;

}

.vacio{

text-align:center;
color:#bbb;
font-size:17px;
margin-top:20px;
font-style:italic;

}

.contador{

text-align:center;
color:#ff6b6b;
margin-top:15px;
font-size:16px;

}

footer{

margin-top:40px;
padding:20px;
text-align:center;
background:black;
border-top:3px solid gold;

}

</style>

</head>

<body>

<header>

✅ MIS TAREAS DE GUERRERO ✅

</header>

<div class="caja">

<h2>Lista de Tareas</h2>

<div class="agregar">

<input type="text" id="nueva" placeholder="Escribe una tarea...">

<button onclick="agregar()">➕ Agregar</button>

</div>

<div id="lista"></div>

<p class="contador" id="contador"></p>

<div class="acciones">

<button onclick="borrarHechas()">🗑 Borrar Completadas</button>

<button onclick="borrarTodas()">❌ Borrar Todo</button>

<a href="index.html">

<button class="volver">🏠 Volver al Menú</button>

</a>

</div>

</div>

<footer>

⚔ "La disciplina es el puente entre tus metas y tus logros." ⚔

</footer>

<script>

const lista=document.getElementById("lista");
const contador=document.getElementById("contador");

function agregar(){

let texto=document.getElementById("nueva").value;

if(texto==""){

alert("Escribe una tarea.");

return;

}

let tareas=JSON.parse(localStorage.getItem("tareas")||"[]");

tareas.push({texto:texto,hecha:false});

localStorage.setItem("tareas",JSON.stringify(tareas));

document.getElementById("nueva").value="";

mostrar();

}

function marcar(indice){

let tareas=JSON.parse(localStorage.getItem("tareas")||"[]");

tareas[indice].hecha=!tareas[indice].hecha;

localStorage.setItem("tareas",JSON.stringify(tareas));

mostrar();

}

function eliminar(indice){

let tareas=JSON.parse(localStorage.getItem("tareas")||"[]");

tareas.splice(indice,1);

localStorage.setItem("tareas",JSON.stringify(tareas));

mostrar();

}

function borrarHechas(){

let tareas=JSON.parse(localStorage.getItem("tareas")||"[]");

tareas=tareas.filter(t=>!t.hecha);

localStorage.setItem("tareas",JSON.stringify(tareas));

mostrar();

}

function borrarTodas(){

let tareas=JSON.parse(localStorage.getItem("tareas")||"[]");

if(tareas.length>0&&!confirm("¿Seguro que quieres borrar todas las tareas?"))return;

localStorage.setItem("tareas","[]");

mostrar();

}

function mostrar(){

let tareas=JSON.parse(localStorage.getItem("tareas")||"[]");

if(tareas.length==0){

lista.innerHTML='<p class="vacio">No tienes tareas pendientes. ¡Añade una!</p>';

contador.innerHTML="";

return;

}

let html="";

let hechas=0;

for(let i=0;i<tareas.length;i++){

if(tareas[i].hecha)hechas++;

html+='<div class="tarea'+(tareas[i].hecha?" hecha":"")+'">'+
'<input type="checkbox" onclick="marcar('+i+')"'+(tareas[i].hecha?" checked":"")+'>'+
'<p>'+tareas[i].texto+'</p>'+
'<button onclick="eliminar('+i+')">🗑</button>'+
'</div>';

}

lista.innerHTML=html;

contador.innerHTML="✔ Completadas: "+hechas+" de "+tareas.length;

}

mostrar();

</script>

</body>
</html>
